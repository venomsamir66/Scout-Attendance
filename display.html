<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاشة القائد</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4D2E">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحضور">
<style>
  :root {
    --bg: #E6EDE1; --surface: #F7FAF4; --ink: #14231A; --muted: #4C6054;
    --forest: #1F4D2E; --on-forest: #F2F6EE; --gold: #E0A526; --line: #B9C7B3; --error: #A82E24;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1D14; --surface: #172A1E; --ink: #E6EFE2; --muted: #9DB2A3;
      --forest: #3E8B58; --on-forest: #0F1D14; --gold: #E8B445; --line: #2E4636; --error: #FF8F82;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, Roboto, sans-serif;
    display: flex; justify-content: center; text-align: center;
  }
  main { width: 100%; max-width: 32rem; padding: 2rem 1.5rem 3rem; }
  h1 { font: 700 1.8rem/1.2 Rockwell, "Roboto Slab", Georgia, serif; margin: 0 0 1.25rem; }
  input, button {
    font: inherit; width: 100%; padding: .9rem 1rem; border-radius: 10px;
  }
  input { border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
  button { border: 0; margin-top: 1rem; background: var(--forest); color: var(--on-forest); font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .error { color: var(--error); font-weight: 600; min-height: 1.5rem; margin: .75rem 0 0; }
  #qrbox {
    background: #fff; padding: 16px; border-radius: 16px; display: inline-block;
    border: 4px solid var(--forest); direction: ltr;
  }
  #qr img, #qr canvas { display: block; }
  .code { font: 700 clamp(2rem, 12vw, 3.4rem)/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; margin: 0 0 1.25rem; white-space: nowrap; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 1.25rem auto 0; max-width: 20rem; }
  .bar > div { height: 100%; width: 100%; background: var(--gold); transition: width 1s linear; }
  .hint { color: var(--muted); margin-top: .75rem; }
  .hint.ok { color: var(--forest); font-weight: 700; }
  .copyright {
    margin: .5rem 0 0;
    color: var(--muted);
    font-size: .65rem;
    opacity: .5;
  }
  .support-link {
    margin-inline-start: .4rem;
    color: inherit;
    text-decoration: none;
  }
  .support-link:hover, .support-link:focus-visible { text-decoration: underline; }
  select { font: inherit; width: 100%; padding: .9rem 1rem; border-radius: 10px;
           border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
  select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button.secondary { background: transparent; color: var(--forest); border: 2px solid var(--forest); }
  dialog#att {
    width: min(34rem, calc(100vw - 1rem)); max-height: calc(100dvh - 1rem); margin: auto;
    padding: 1rem 1.1rem 1.25rem; border: 2px solid var(--line); border-radius: 16px;
    background: var(--surface); color: var(--ink); text-align: start; overflow: auto;
  }
  dialog#att::backdrop { background: rgba(0, 0, 0, .55); }
  .ahead { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .ahead h2 { margin: 0; font-size: 1.3rem; }
  .ahead button { width: auto; margin: 0; padding: .5rem 1rem; }
  #adate { margin: .9rem 0 0; }
  .acount { font-weight: 700; font-size: 1.15rem; margin: .9rem 0 .25rem; }
  .arow { display: flex; justify-content: space-between; gap: .75rem; padding: .35rem 0; border-bottom: 1px solid var(--line); }
  .arow .t { color: var(--muted); white-space: nowrap; }
  .asub { margin: 1.1rem 0 .25rem; font-weight: 700; color: var(--muted); }
  .aabsent { color: var(--muted); padding: .2rem 0; }
  details.manual { margin-top: 2rem; text-align: start; border: 2px solid var(--line); border-radius: 14px;
                   padding: .85rem 1rem 1rem; background: var(--surface); }
  details.manual summary { font-weight: 700; cursor: pointer; }
  /* One column that can never be wider than the box, so nothing spills out on small phones. */
  .mbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: .75rem; margin-top: .85rem; }
  .mbody > * { width: auto; min-width: 0; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login">
    <h1 id="ltitle"></h1>
    <form id="form">
      <input id="pw" type="password" autocomplete="off" aria-label="password">
      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="go"></button>
    </form>
  </section>

  <section id="show" hidden>
    <h1 id="stitle"></h1>
    <div class="code" id="code" dir="ltr"></div>
    <div id="qrbox"><div id="qr"></div></div>
    <div class="bar"><div id="fill"></div></div>
    <p class="hint" id="hint"></p>

    <button type="button" class="secondary" id="abtn"></button>

    <details class="manual">
      <summary id="msum"></summary>
      <div class="mbody">
        <select id="mroster" aria-label="scout"></select>
        <input id="mname" type="text" dir="auto" maxlength="60" hidden>
        <button type="button" id="mgo"></button>
        <p class="hint" id="mmsg" role="status"></p>
      </div>
    </details>
  </section>
  <p class="copyright" dir="ltr">
    © 2026 Youssef Samir. All rights reserved.
    <a class="support-link" id="support-link" href="mailto:youssefsamir8989@gmail.com"></a>
  </p>
</main>

<dialog id="att" aria-labelledby="atitle">
  <div class="ahead">
    <h2 id="atitle"></h2>
    <button type="button" id="aclose"></button>
  </div>
  <select id="adate" aria-label="date"></select>
  <p class="acount" id="acount"></p>
  <div id="alist"></div>
  <p class="asub" id="asub" hidden></p>
  <div id="aabsent"></div>
  <p class="error" id="aerr" role="alert"></p>
  <button type="button" class="secondary" id="arefresh"></button>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // ---- Edit these lines ----
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHuT96lN2SpUvKUu_ibgIgMxehFNJ79FFlpnvn-XNh_jW1E8pmZJzZZzlDHRVe90MqZA/exec";               // same URL as in index.html
  const CHECKIN_URL = "https://venomsamir66.github.io/Scout-Attendance/";        // your check-in page link
  const LANG = "ar";                                               // "ar" or "en"
  // --------------------------

  const T = {
    ar: { login: "شاشة القائد", pw: "كلمة مرور القائد", go: "إظهار رمز QR", support: "Contact support",
          wrong: "كلمة المرور غير صحيحة.", net: "تعذّر الاتصال. حاول مرة أخرى.",
          show: "رمز الاجتماع", hint: "امسحوا QR لفتح صفحة التسجيل؛ سيُخفى رمز الاجتماع تلقائيًا. يتغير الرمز تلقائيًا.",
          msum: "تسجيل حضور يدوي (لكشاف بدون هاتف)", mpick: "— اختر الكشاف —", mnew: "➕ اسم جديد",
          mname: "الاسم الثلاثي", mgo: "تسجيل الحضور", mpickErr: "اختر الكشاف أو اكتب اسمه.",
          mbad: "اكتب الاسم الثلاثي بالحروف فقط.", mok: "✓ تم تسجيل حضور", mdup: "مسجَّل بالفعل اليوم:",
          abtn: "📋 عرض الحضور", atitle: "سجل الحضور", aclose: "إغلاق", arefresh: "تحديث",
          apresent: "الحاضرون", aof: "من", aabsent: "لم يحضروا", anone: "لا يوجد حضور مسجَّل بعد.", atoday: "اليوم",
          mtoomany: "تمت إضافة أسماء كثيرة في وقت قصير.", mlocked: "محاولات كثيرة. انتظر قليلًا." },
    en: { login: "Leader screen", pw: "Leader password", go: "Show QR code", support: "Contact support",
          wrong: "Wrong password.", net: "Couldn’t connect. Try again.",
          show: "Meeting code", hint: "Scan the QR to open check-in; the meeting code will be hidden automatically. The code changes automatically.",
          msum: "Manual check-in (for a scout without a phone)", mpick: "— Choose the scout —", mnew: "➕ New name",
          mname: "Full name (three parts)", mgo: "Check in", mpickErr: "Choose a scout or type a name.",
          mbad: "Enter a three-part name using letters only.", mok: "✓ Checked in:", mdup: "Already checked in today:",
          abtn: "📋 Show attendance", atitle: "Attendance", aclose: "Close", arefresh: "Refresh",
          apresent: "Present", aof: "of", aabsent: "Not here", anone: "No one has checked in yet.", atoday: "today",
          mtoomany: "Too many new names were added recently.", mlocked: "Too many attempts. Wait a little." }
  }[LANG];

  const $ = (id) => document.getElementById(id);
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  $("support-link").textContent = T.support;
  $("ltitle").textContent = T.login;
  $("pw").placeholder = T.pw;
  $("go").textContent = T.go;
  $("stitle").textContent = T.show;
  $("hint").textContent = T.hint;
  $("msum").textContent = T.msum;
  $("mgo").textContent = T.mgo;
  $("abtn").textContent = T.abtn;
  $("atitle").textContent = T.atitle;
  $("aclose").textContent = T.aclose;
  $("arefresh").textContent = T.arefresh;
  $("mname").placeholder = T.mname;

  let password = "", qr = null, lastToken = "", total = 60, endsAt = 0, timer = null;

  function tick() {
    const left = Math.max(0, (endsAt - Date.now()) / 1000);
    $("fill").style.width = Math.min(100, (left / total) * 100) + "%";
  }
  setInterval(tick, 1000);

  function draw(token) {
    if (token === lastToken) return;
    lastToken = token;
    $("code").textContent = token.slice(0, 3) + " " + token.slice(3);
    const url = CHECKIN_URL + (CHECKIN_URL.includes("?") ? "&" : "?") + "t=" + token;
    const size = Math.min(380, Math.floor(Math.min(innerWidth, innerHeight) * 0.7));
    if (!qr) {
      qr = new QRCode($("qr"), { text: url, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
    } else {
      qr.makeCode(url);
    }
  }

  async function refresh() {
    try {
      const res = await fetch(SCRIPT_URL + "?action=token&key=" + encodeURIComponent(password));
      const out = await res.json();
      if (!out.ok) { showLogin(T.wrong); return false; }
      draw(out.token);
      fillNames(out.names || []);
      total = out.windowSeconds || total;
      endsAt = Date.now() + out.secondsLeft * 1000;
      tick();
      $("login").hidden = true; $("show").hidden = false; $("pw").value = "";
      clearTimeout(timer);
      timer = setTimeout(refresh, Math.min(300, Math.max(2, out.secondsLeft + 1)) * 1000);
      return true;
    } catch (e) {
      $("error").textContent = T.net;
      clearTimeout(timer);
      timer = setTimeout(refresh, 5000);
      return false;
    }
  }

  // ---- Attendance viewer: who is present (and who isn't) on a date ----
  async function loadAttendance(date) {
    $("aerr").textContent = "";
    try {
      const url = SCRIPT_URL + "?action=attendance&key=" + encodeURIComponent(password) +
                  (date ? "&date=" + encodeURIComponent(date) : "");
      const out = await (await fetch(url)).json();
      if (!out.ok) {
        if (out.error === "denied") { $("att").close(); showLogin(T.wrong); }
        else $("aerr").textContent = out.error === "locked" ? T.mlocked : T.net;
        return;
      }
      const sel = $("adate");
      sel.innerHTML = "";
      out.dates.forEach((d) => sel.add(new Option(d === out.today ? d + " (" + T.atoday + ")" : d, d)));
      sel.value = out.date;

      $("acount").textContent = T.apresent + ": " + out.present.length + (out.total ? " " + T.aof + " " + out.total : "");
      const list = $("alist");
      list.replaceChildren();
      if (!out.present.length) {
        const none = document.createElement("div");
        none.className = "aabsent";
        none.textContent = T.anone;
        list.append(none);
      }
      out.present.forEach((r, i) => {
        const row = document.createElement("div");
        row.className = "arow";
        const n = document.createElement("span");
        n.textContent = (i + 1) + ". " + r.name;
        const t = document.createElement("span");
        t.className = "t";
        t.textContent = r.time;
        row.append(n, t);
        list.append(row);
      });

      $("asub").hidden = !out.absent.length;
      $("asub").textContent = T.aabsent + " (" + out.absent.length + ")";
      const ab = $("aabsent");
      ab.replaceChildren();
      out.absent.forEach((name) => {
        const d = document.createElement("div");
        d.className = "aabsent";
        d.textContent = name;
        ab.append(d);
      });
    } catch (e) {
      $("aerr").textContent = T.net;
    }
  }

  $("abtn").addEventListener("click", () => { $("att").showModal(); loadAttendance(); });
  $("aclose").addEventListener("click", () => $("att").close());
  $("arefresh").addEventListener("click", () => loadAttendance($("adate").value));
  $("adate").addEventListener("change", () => loadAttendance($("adate").value));

  // ---- Manual check-in: the leader can check in anyone at any time (no code needed) ----
  const NEW = "__new__";

  function fillNames(names) {
    const sel = $("mroster"), keep = sel.value;
    sel.innerHTML = "";
    sel.add(new Option(T.mpick, ""));
    names.forEach((n) => sel.add(new Option(n, n)));
    sel.add(new Option(T.mnew, NEW));
    sel.value = (names.includes(keep) || keep === NEW) ? keep : "";
    $("mname").hidden = sel.value !== NEW;
  }

  $("mroster").addEventListener("change", () => {
    $("mname").hidden = $("mroster").value !== NEW;
    if (!$("mname").hidden) $("mname").focus();
  });

  $("mgo").addEventListener("click", async () => {
    const msg = $("mmsg");
    msg.className = "hint";
    msg.textContent = "";
    const isNew = $("mroster").value === NEW;
    const name = (isNew ? $("mname").value : $("mroster").value).trim().replace(/\s+/g, " ");
    if (!name) { msg.textContent = T.mpickErr; return; }
    if (isNew && (name.split(" ").length < 3 || !/^[\p{L}\p{M}\s'’.\-]+$/u.test(name))) {
      msg.textContent = T.mbad;
      return;
    }
    $("mgo").disabled = true;
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "leader", key: password, name, isNew })
      });
      const out = await res.json();
      if (out.ok) {
        msg.className = "hint ok";
        msg.textContent = (out.duplicate ? T.mdup : T.mok) + " " + name;
        $("mroster").value = "";
        $("mname").value = "";
        $("mname").hidden = true;
        refresh(); // reloads the list so a newly added name appears
      } else if (out.error === "denied") {
        showLogin(T.wrong);
      } else {
        msg.textContent = out.error === "badname" ? T.mbad
                        : out.error === "toomany" ? T.mtoomany
                        : out.error === "locked"  ? T.mlocked
                        : T.net;
      }
    } catch (e) {
      msg.textContent = T.net;
    } finally {
      $("mgo").disabled = false;
    }
  });

  function showLogin(msg) {
    password = "";
    $("show").hidden = true;
    $("login").hidden = false;
    $("error").textContent = msg || "";
  }

  // Install as an app (works on GitHub Pages because everything uses relative paths).
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  // Keep the screen on while the code is showing.
  let wake = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !document.hidden) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  keepAwake();
  document.addEventListener("visibilitychange", keepAwake);

  // Phones pause timers when the screen sleeps; re-check as soon as the page is visible again.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && password) refresh(); });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (SCRIPT_URL.startsWith("PASTE_")) { $("error").textContent = "SCRIPT_URL not set"; return; }
    password = $("pw").value;
    $("go").disabled = true;
    $("error").textContent = "";
    await refresh();
    $("go").disabled = false;
  });
</script>
</body>
</html>
