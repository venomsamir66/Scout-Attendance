<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاشة القائد</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4D2E">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحضور">
<style>
  :root {
    --bg: #E6EDE1; --surface: #F7FAF4; --ink: #14231A; --muted: #4C6054;
    --forest: #1F4D2E; --on-forest: #F2F6EE; --gold: #E0A526; --line: #B9C7B3; --error: #A82E24;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1D14; --surface: #172A1E; --ink: #E6EFE2; --muted: #9DB2A3;
      --forest: #3E8B58; --on-forest: #0F1D14; --gold: #E8B445; --line: #2E4636; --error: #FF8F82;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, Roboto, sans-serif;
    display: flex; justify-content: center; text-align: center;
  }
  main { width: 100%; max-width: 32rem; padding: 2rem 1.5rem 3rem; }
  h1 { font: 700 1.8rem/1.2 Rockwell, "Roboto Slab", Georgia, serif; margin: 0 0 1.25rem; }
  input, button {
    font: inherit; width: 100%; padding: .9rem 1rem; border-radius: 10px;
  }
  input { border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
  button { border: 0; margin-top: 1rem; background: var(--forest); color: var(--on-forest); font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .error { color: var(--error); font-weight: 600; min-height: 1.5rem; margin: .75rem 0 0; }
  #qrbox {
    background: #fff; padding: 16px; border-radius: 16px; display: inline-block;
    border: 4px solid var(--forest); direction: ltr;
  }
  #qr img, #qr canvas { display: block; }
  .code { font: 700 3.4rem/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; margin: 0 0 1.25rem; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 1.25rem auto 0; max-width: 20rem; }
  .bar > div { height: 100%; width: 100%; background: var(--gold); transition: width 1s linear; }
  .hint { color: var(--muted); margin-top: .75rem; }
  .hint.ok { color: var(--forest); font-weight: 700; }
  select { font: inherit; width: 100%; padding: .9rem 1rem; border-radius: 10px; margin-top: .75rem;
           border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
  select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #mname { margin-top: .75rem; }
  details.manual { margin-top: 2rem; text-align: start; border: 2px solid var(--line); border-radius: 14px;
                   padding: .85rem 1rem 1rem; background: var(--surface); }
  details.manual summary { font-weight: 700; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login">
    <h1 id="ltitle"></h1>
    <form id="form">
      <input id="pw" type="password" autocomplete="off" aria-label="password">
      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="go"></button>
    </form>
  </section>

  <section id="show" hidden>
    <h1 id="stitle"></h1>
    <div class="code" id="code" dir="ltr"></div>
    <div id="qrbox"><div id="qr"></div></div>
    <div class="bar"><div id="fill"></div></div>
    <p class="hint" id="hint"></p>

    <details class="manual">
      <summary id="msum"></summary>
      <select id="mroster" aria-label="scout"></select>
      <input id="mname" type="text" dir="auto" maxlength="60" hidden>
      <button type="button" id="mgo"></button>
      <p class="hint" id="mmsg" role="status"></p>
    </details>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // ---- Edit these lines ----
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHuT96lN2SpUvKUu_ibgIgMxehFNJ79FFlpnvn-XNh_jW1E8pmZJzZZzlDHRVe90MqZA/exec";               // same URL as in index.html
  const CHECKIN_URL = "https://venomsamir66.github.io/Scout-Attendance/";        // your check-in page link
  const LANG = "ar";                                               // "ar" or "en"
  // --------------------------

  const T = {
    ar: { login: "شاشة القائد", pw: "كلمة مرور القائد", go: "إظهار رمز QR",
          wrong: "كلمة المرور غير صحيحة.", net: "تعذّر الاتصال. حاول مرة أخرى.",
          show: "رمز الاجتماع", hint: "اكتبوا الرمز في الصفحة، أو امسحوا QR لإدخاله تلقائيًا. يتغير الرمز تلقائيًا.",
          msum: "تسجيل حضور يدوي (لكشاف بدون هاتف)", mpick: "— اختر الكشاف —", mnew: "➕ اسم جديد",
          mname: "الاسم الثلاثي", mgo: "تسجيل الحضور", mpickErr: "اختر الكشاف أو اكتب اسمه.",
          mbad: "اكتب الاسم الثلاثي بالحروف فقط.", mok: "✓ تم تسجيل حضور", mdup: "مسجَّل بالفعل اليوم:",
          mtoomany: "تمت إضافة أسماء كثيرة في وقت قصير.", mlocked: "محاولات كثيرة. انتظر قليلًا." },
    en: { login: "Leader screen", pw: "Leader password", go: "Show QR code",
          wrong: "Wrong password.", net: "Couldn’t connect. Try again.",
          show: "Meeting code", hint: "Type the code on the page, or scan the QR to fill it in. The code changes automatically.",
          msum: "Manual check-in (for a scout without a phone)", mpick: "— Choose the scout —", mnew: "➕ New name",
          mname: "Full name (three parts)", mgo: "Check in", mpickErr: "Choose a scout or type a name.",
          mbad: "Enter a three-part name using letters only.", mok: "✓ Checked in:", mdup: "Already checked in today:",
          mtoomany: "Too many new names were added recently.", mlocked: "Too many attempts. Wait a little." }
  }[LANG];

  const $ = (id) => document.getElementById(id);
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  $("ltitle").textContent = T.login;
  $("pw").placeholder = T.pw;
  $("go").textContent = T.go;
  $("stitle").textContent = T.show;
  $("hint").textContent = T.hint;
  $("msum").textContent = T.msum;
  $("mgo").textContent = T.mgo;
  $("mname").placeholder = T.mname;

  let password = "", qr = null, lastToken = "", total = 60, endsAt = 0, timer = null;

  function tick() {
    const left = Math.max(0, (endsAt - Date.now()) / 1000);
    $("fill").style.width = Math.min(100, (left / total) * 100) + "%";
  }
  setInterval(tick, 1000);

  function draw(token) {
    if (token === lastToken) return;
    lastToken = token;
    $("code").textContent = token.slice(0, 3) + " " + token.slice(3);
    const url = CHECKIN_URL + (CHECKIN_URL.includes("?") ? "&" : "?") + "t=" + token;
    const size = Math.min(380, Math.floor(Math.min(innerWidth, innerHeight) * 0.7));
    if (!qr) {
      qr = new QRCode($("qr"), { text: url, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
    } else {
      qr.makeCode(url);
    }
  }

  async function refresh() {
    try {
      const res = await fetch(SCRIPT_URL + "?action=token&key=" + encodeURIComponent(password));
      const out = await res.json();
      if (!out.ok) { showLogin(T.wrong); return false; }
      draw(out.token);
      fillNames(out.names || []);
      total = out.windowSeconds || total;
      endsAt = Date.now() + out.secondsLeft * 1000;
      tick();
      $("login").hidden = true; $("show").hidden = false; $("pw").value = "";
      clearTimeout(timer);
      timer = setTimeout(refresh, Math.min(300, Math.max(2, out.secondsLeft + 1)) * 1000);
      return true;
    } catch (e) {
      $("error").textContent = T.net;
      clearTimeout(timer);
      timer = setTimeout(refresh, 5000);
      return false;
    }
  }

  // ---- Manual check-in: the leader can check in anyone at any time (no code needed) ----
  const NEW = "__new__";

  function fillNames(names) {
    const sel = $("mroster"), keep = sel.value;
    sel.innerHTML = "";
    sel.add(new Option(T.mpick, ""));
    names.forEach((n) => sel.add(new Option(n, n)));
    sel.add(new Option(T.mnew, NEW));
    sel.value = (names.includes(keep) || keep === NEW) ? keep : "";
    $("mname").hidden = sel.value !== NEW;
  }

  $("mroster").addEventListener("change", () => {
    $("mname").hidden = $("mroster").value !== NEW;
    if (!$("mname").hidden) $("mname").focus();
  });

  $("mgo").addEventListener("click", async () => {
    const msg = $("mmsg");
    msg.className = "hint";
    msg.textContent = "";
    const isNew = $("mroster").value === NEW;
    const name = (isNew ? $("mname").value : $("mroster").value).trim().replace(/\s+/g, " ");
    if (!name) { msg.textContent = T.mpickErr; return; }
    if (isNew && (name.split(" ").length < 3 || !/^[\p{L}\p{M}\s'’.\-]+$/u.test(name))) {
      msg.textContent = T.mbad;
      return;
    }
    $("mgo").disabled = true;
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "leader", key: password, name, isNew })
      });
      const out = await res.json();
      if (out.ok) {
        msg.className = "hint ok";
        msg.textContent = (out.duplicate ? T.mdup : T.mok) + " " + name;
        $("mroster").value = "";
        $("mname").value = "";
        $("mname").hidden = true;
        refresh(); // reloads the list so a newly added name appears
      } else if (out.error === "denied") {
        showLogin(T.wrong);
      } else {
        msg.textContent = out.error === "badname" ? T.mbad
                        : out.error === "toomany" ? T.mtoomany
                        : out.error === "locked"  ? T.mlocked
                        : T.net;
      }
    } catch (e) {
      msg.textContent = T.net;
    } finally {
      $("mgo").disabled = false;
    }
  });

  function showLogin(msg) {
    password = "";
    $("show").hidden = true;
    $("login").hidden = false;
    $("error").textContent = msg || "";
  }

  // Install as an app (works on GitHub Pages because everything uses relative paths).
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  // Keep the screen on while the code is showing.
  let wake = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !document.hidden) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  keepAwake();
  document.addEventListener("visibilitychange", keepAwake);

  // Phones pause timers when the screen sleeps; re-check as soon as the page is visible again.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && password) refresh(); });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (SCRIPT_URL.startsWith("PASTE_")) { $("error").textContent = "SCRIPT_URL not set"; return; }
    password = $("pw").value;
    $("go").disabled = true;
    $("error").textContent = "";
    await refresh();
    $("go").disabled = false;
  });
</script>
</body>
</html>
