<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاشة القائد</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4D2E">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحضور">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  :root {
    --bg: #E6EDE1; --surface: #F7FAF4; --ink: #14231A; --muted: #4C6054;
    --forest: #1F4D2E; --on-forest: #F2F6EE; --gold: #E0A526; --line: #B9C7B3; --error: #A82E24;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1D14; --surface: #172A1E; --ink: #E6EFE2; --muted: #9DB2A3;
      --forest: #3E8B58; --on-forest: #0F1D14; --gold: #E8B445; --line: #2E4636; --error: #FF8F82;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, Roboto, sans-serif;
    display: flex; justify-content: center; text-align: center;
  }
  main { width: 100%; max-width: 32rem; padding: 2rem 1.5rem 3rem; }
  h1 { font: 700 1.8rem/1.2 Rockwell, "Roboto Slab", Georgia, serif; margin: 0 0 1.25rem; }
  input, button {
    font: inherit; width: 100%; padding: .9rem 1rem; border-radius: 10px;
  }
  input { border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
  label.remember { display: flex; align-items: center; gap: .6rem; margin-top: .75rem; text-align: start; font-size: .9rem; }
  label.remember input { width: auto; margin: 0; }
  button { border: 0; margin-top: 1rem; background: var(--forest); color: var(--on-forest); font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .error { color: var(--error); font-weight: 600; min-height: 1.5rem; margin: .75rem 0 0; }
  #qrbox {
    background: #fff; padding: 16px; border-radius: 16px; display: inline-block;
    border: 4px solid var(--forest); direction: ltr;
  }
  #qr img, #qr canvas { display: block; }
  .code { font: 700 clamp(2rem, 12vw, 3.4rem)/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; margin: 0 0 1.25rem; white-space: nowrap; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 1.25rem auto 0; max-width: 20rem; }
  .bar > div { height: 100%; width: 100%; background: var(--gold); transition: width 1s linear; }
  .hint { color: var(--muted); margin-top: .75rem; }
  .hint.ok { color: var(--forest); font-weight: 700; }
  .copyright {
    margin: .5rem 0 0;
    color: var(--muted);
    font-size: .65rem;
    opacity: .5;
  }
  .support-link {
    margin-inline-start: .4rem;
    color: inherit;
    text-decoration: none;
  }
  .support-link:hover, .support-link:focus-visible { text-decoration: underline; }
  select { font: inherit; width: 100%; padding: .9rem 1rem; border-radius: 10px;
           border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
  select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button.secondary { background: transparent; color: var(--forest); border: 2px solid var(--forest); }
  dialog#att {
    width: min(34rem, calc(100vw - 1rem)); max-height: calc(100dvh - 1rem); margin: auto;
    padding: 1rem 1.1rem 1.25rem; border: 2px solid var(--line); border-radius: 16px;
    background: var(--surface); color: var(--ink); text-align: start; overflow: auto;
  }
  dialog#att::backdrop { background: rgba(0, 0, 0, .55); }
  .ahead { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .ahead h2, .ahead h3 { margin: 0; font-size: 1.3rem; }
  .ahead button { width: auto; margin: 0; padding: .5rem 1rem; }
  #adate { margin: .9rem 0 0; }
  .acount { font-weight: 700; font-size: 1.15rem; margin: .9rem 0 .25rem; }
  .arow { display: flex; justify-content: space-between; gap: .75rem; padding: .35rem 0; border-bottom: 1px solid var(--line); }
  .arow .t { color: var(--muted); white-space: nowrap; }
  .asub { margin: 1.1rem 0 .25rem; font-weight: 700; color: var(--muted); }
  .aabsent { color: var(--muted); padding: .2rem 0; }
  .aexcuse { width: auto; margin: 0; padding: .2rem .65rem; font-size: .85rem; }
  .aactions { display: flex; gap: .75rem; margin-top: .9rem; }
  .aactions button { flex: 1; margin: 0; padding: .7rem .5rem; }
  .asummary-row { padding: .7rem 0; border-bottom: 1px solid var(--line); text-align: start; }
  .asummary-top { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; }
  .asummary-top > strong { min-width: 0; overflow-wrap: anywhere; }
  .asummary-rate { font-weight: 700; white-space: nowrap; }
  .asummary-detail { color: var(--muted); font-size: .9rem; }
  details.manual { margin-top: 2rem; text-align: start; border: 2px solid var(--line); border-radius: 14px;
                   padding: .85rem 1rem 1rem; background: var(--surface); }
  details.manual summary { font-weight: 700; cursor: pointer; }
  /* One column that can never be wider than the box, so nothing spills out on small phones. */
  .mbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: .75rem; margin-top: .85rem; }
  .mbody > * { width: auto; min-width: 0; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login">
    <h1 id="ltitle"></h1>
    <form id="form">
      <input id="pw" type="password" autocomplete="current-password" aria-label="password">
      <label class="remember"><input id="remember" type="checkbox"> <span id="remember-label"></span></label>
      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="go"></button>
    </form>
  </section>

  <section id="show" hidden>
    <h1 id="stitle"></h1>
    <div class="code" id="code" dir="ltr"></div>
    <div id="qrbox"><div id="qr"></div></div>
    <div class="bar"><div id="fill"></div></div>
    <p class="hint" id="hint"></p>

    <button type="button" class="secondary" id="abtn"></button>

    <details class="manual">
      <summary id="msum"></summary>
      <div class="mbody">
        <select id="mroster" aria-label="scout"></select>
        <input id="mname" type="text" dir="auto" maxlength="60" hidden>
        <button type="button" id="mgo"></button>
        <p class="hint" id="mmsg" role="status"></p>
      </div>
    </details>
  </section>
  <p class="copyright" dir="ltr">
    © 2026 Youssef. All rights reserved.
    <a class="support-link" id="support-link" href="mailto:youssefsamir8989@gmail.com"></a>
  </p>
</main>

<dialog id="att" aria-labelledby="atitle">
  <div class="ahead">
    <h2 id="atitle"></h2>
    <button type="button" id="aclose"></button>
  </div>
  <div id="adaily">
    <select id="adate" aria-label="date"></select>
    <p class="acount" id="acount"></p>
    <div id="alist"></div>
    <p class="asub" id="asub" hidden></p>
    <div id="aabsent"></div>
    <p class="error" id="aerr" role="alert"></p>
    <div class="aactions">
      <button type="button" class="secondary" id="aexport" disabled></button>
      <button type="button" class="secondary" id="arefresh"></button>
    </div>
    <button type="button" class="secondary" id="asummary-open" disabled></button>
  </div>
  <section id="asummary" aria-labelledby="asummary-title" hidden>
    <div class="ahead">
      <h3 id="asummary-title"></h3>
      <button type="button" id="asummary-back"></button>
    </div>
    <p class="hint" id="asummary-status" role="status" aria-live="polite"></p>
    <div id="asummary-list"></div>
    <p class="error" id="asummary-error" role="alert"></p>
  </section>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // ---- Edit these lines ----
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHuT96lN2SpUvKUu_ibgIgMxehFNJ79FFlpnvn-XNh_jW1E8pmZJzZZzlDHRVe90MqZA/exec";               // same URL as in index.html
  const CHECKIN_URL = "https://venomsamir66.github.io/Scout-Attendance/";        // your check-in page link
  const LANG = "ar";                                               // "ar" or "en"
  // --------------------------

  const T = {
    ar: { login: "شاشة القائد", pw: "كلمة مرور القائد", go: "إظهار رمز QR", support: "Contact support",
          remember: "ابقني مسجّلًا (حفظ كلمة المرور في هذا المتصفح)", rememberError: "تعذّر الوصول إلى التخزين المحلي على هذا الجهاز.",
          wrong: "كلمة المرور غير صحيحة.", net: "تعذّر الاتصال. حاول مرة أخرى.", attendanceLoading: "جارٍ تحميل الحضور...",
          show: "رمز الاجتماع", hint: "امسحوا QR لفتح صفحة التسجيل؛ سيُخفى رمز الاجتماع تلقائيًا. يتغير الرمز تلقائيًا.",
          msum: "تسجيل حضور يدوي (لكشاف بدون هاتف)", mpick: "— اختر الكشاف —", mnew: "➕ اسم جديد",
          mname: "الاسم الثلاثي", mgo: "تسجيل الحضور", mpickErr: "اختر الكشاف أو اكتب اسمه.",
          mbad: "اكتب الاسم الثلاثي بالحروف فقط.", mok: "✓ تم تسجيل حضور", mdup: "مسجَّل بالفعل اليوم:",
          abtn: "📋 عرض الحضور", atitle: "سجل الحضور", aclose: "إغلاق", arefresh: "تحديث",
          apresent: "الحاضرون", aof: "من", aabsent: "لم يحضروا", anone: "لا يوجد حضور مسجَّل بعد.", atoday: "اليوم",
          markExcused: "إضافة عذر", excused: "لديه عذر", excuseError: "تعذّر حفظ العذر. حدّث Apps Script وحاول مرة أخرى.",
          exportCsv: "تنزيل CSV", csvDate: "التاريخ", csvName: "الاسم", csvStatus: "الحالة", csvTime: "وقت التسجيل",
          csvPresent: "حاضر", csvAbsent: "غائب", csvExcused: "بعذر",
          summaryOpen: "عرض ملخص الحضور", summaryTitle: "ملخص الحضور", summaryBack: "العودة للحضور اليومي",
          summaryLoading: "جارٍ إعداد الملخص...", summaryMeetings: "اجتماعات", summaryRate: "نسبة الحضور",
          summaryAttended: "حضر", summaryOf: "من", summaryRecent: "آخر الغيابات",
          summaryNoAbsences: "لا توجد غيابات", summaryEmpty: "لا توجد اجتماعات مسجلة.",
          mtoomany: "تمت إضافة أسماء كثيرة في وقت قصير.", mlocked: "محاولات كثيرة. انتظر قليلًا." },
    en: { login: "Leader screen", pw: "Leader password", go: "Show QR code", support: "Contact support",
          remember: "Stay signed in (save password in this browser)", rememberError: "Could not access local storage on this device.",
          wrong: "Wrong password.", net: "Couldn’t connect. Try again.", attendanceLoading: "Loading attendance...",
          show: "Meeting code", hint: "Scan the QR to open check-in; the meeting code will be hidden automatically. The code changes automatically.",
          msum: "Manual check-in (for a scout without a phone)", mpick: "— Choose the scout —", mnew: "➕ New name",
          mname: "Full name (three parts)", mgo: "Check in", mpickErr: "Choose a scout or type a name.",
          mbad: "Enter a three-part name using letters only.", mok: "✓ Checked in:", mdup: "Already checked in today:",
          abtn: "📋 Show attendance", atitle: "Attendance", aclose: "Close", arefresh: "Refresh",
          apresent: "Present", aof: "of", aabsent: "Not here", anone: "No one has checked in yet.", atoday: "today",
          markExcused: "Mark excused", excused: "Excused", excuseError: "Couldn’t save the excuse. Update Apps Script and try again.",
          exportCsv: "Export CSV", csvDate: "Date", csvName: "Name", csvStatus: "Status", csvTime: "Check-in time",
          csvPresent: "Present", csvAbsent: "Absent", csvExcused: "Excused",
          summaryOpen: "Show attendance summary", summaryTitle: "Attendance summary", summaryBack: "Back to daily attendance",
          summaryLoading: "Building summary...", summaryMeetings: "meetings", summaryRate: "Attendance rate",
          summaryAttended: "Attended", summaryOf: "of", summaryRecent: "Recent absences",
          summaryNoAbsences: "No absences", summaryEmpty: "No meetings have been recorded.",
          mtoomany: "Too many new names were added recently.", mlocked: "Too many attempts. Wait a little." }
  }[LANG];

  const $ = (id) => document.getElementById(id);
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  $("support-link").textContent = T.support;
  $("ltitle").textContent = T.login;
  $("pw").placeholder = T.pw;
  $("remember-label").textContent = T.remember;
  $("go").textContent = T.go;
  $("stitle").textContent = T.show;
  $("hint").textContent = T.hint;
  $("msum").textContent = T.msum;
  $("mgo").textContent = T.mgo;
  $("abtn").textContent = T.abtn;
  $("atitle").textContent = T.atitle;
  $("aclose").textContent = T.aclose;
  $("aexport").textContent = T.exportCsv;
  $("arefresh").textContent = T.arefresh;
  $("asummary-open").textContent = T.summaryOpen;
  $("asummary-title").textContent = T.summaryTitle;
  $("asummary-back").textContent = T.summaryBack;
  $("mname").placeholder = T.mname;

  let password = "", qr = null, lastToken = "", total = 60, endsAt = 0, timer = null;
  let attendanceData = null;
  let attendanceLoading = false;
  const PASSWORD_KEY = "scoutLeaderPassword";

  function showLogin(msg, clearSaved = false) {
    password = "";
    if (clearSaved) {
      try { localStorage.removeItem(PASSWORD_KEY); } catch (e) { msg = T.rememberError; }
      $("remember").checked = false;
    }
    $("show").hidden = true;
    $("login").hidden = false;
    $("error").textContent = msg || "";
  }

  function tick() {
    const left = Math.max(0, (endsAt - Date.now()) / 1000);
    $("fill").style.width = Math.min(100, (left / total) * 100) + "%";
  }
  setInterval(tick, 1000);

  function draw(token) {
    if (token === lastToken) return;
    lastToken = token;
    $("code").textContent = token.slice(0, 3) + " " + token.slice(3);
    const url = CHECKIN_URL + (CHECKIN_URL.includes("?") ? "&" : "?") + "t=" + token;
    const size = Math.min(380, Math.floor(Math.min(innerWidth, innerHeight) * 0.7));
    if (!qr) {
      qr = new QRCode($("qr"), { text: url, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
    } else {
      qr.makeCode(url);
    }
  }

  async function refresh() {
    try {
      const res = await fetch(SCRIPT_URL + "?action=token&key=" + encodeURIComponent(password));
      const out = await res.json();
      if (!out.ok) {
        showLogin(out.error === "denied" ? T.wrong : T.mlocked, out.error === "denied");
        return false;
      }
      try {
        if ($("remember").checked) localStorage.setItem(PASSWORD_KEY, password);
        else localStorage.removeItem(PASSWORD_KEY);
      } catch (e) {
        $("remember").checked = false;
        showLogin(T.rememberError);
        return false;
      }
      draw(out.token);
      fillNames(out.names || []);
      total = out.windowSeconds || total;
      endsAt = Date.now() + out.secondsLeft * 1000;
      tick();
      $("login").hidden = true; $("show").hidden = false; $("pw").value = "";
      if (!attendanceData && !attendanceLoading) loadAttendance();
      clearTimeout(timer);
      timer = setTimeout(refresh, Math.min(300, Math.max(2, out.secondsLeft + 1)) * 1000);
      return true;
    } catch (e) {
      $("error").textContent = T.net;
      clearTimeout(timer);
      timer = setTimeout(refresh, 5000);
      return false;
    }
  }

  // ---- Attendance viewer: who is present (and who isn't) on a date ----
  async function loadAttendance(date) {
    $("aerr").textContent = "";
    if (!date && attendanceLoading) return;
    if (!attendanceData || (date && attendanceData.date !== date)) {
      attendanceData = null;
      $("acount").textContent = T.attendanceLoading;
      $("alist").replaceChildren();
      $("aabsent").replaceChildren();
      $("aexport").disabled = true;
      $("asummary-open").disabled = true;
    }
    if (!date) attendanceLoading = true;
    try {
      const url = SCRIPT_URL + "?action=attendance&key=" + encodeURIComponent(password) +
                  (date ? "&date=" + encodeURIComponent(date) : "");
      const out = await (await fetch(url)).json();
      if (!out.ok) {
        if (out.error === "denied") { $("att").close(); showLogin(T.wrong, true); }
        else $("aerr").textContent = out.error === "locked" ? T.mlocked : T.net;
        return;
      }
      const sel = $("adate");
      sel.innerHTML = "";
      out.dates.forEach((d) => sel.add(new Option(d === out.today ? d + " (" + T.atoday + ")" : d, d)));
      sel.value = out.date;

      $("acount").textContent = T.apresent + ": " + out.present.length + (out.total ? " " + T.aof + " " + out.total : "");
      const list = $("alist");
      list.replaceChildren();
      if (!out.present.length) {
        const none = document.createElement("div");
        none.className = "aabsent";
        none.textContent = T.anone;
        list.append(none);
      }
      out.present.forEach((r, i) => {
        const row = document.createElement("div");
        row.className = "arow";
        const n = document.createElement("span");
        n.textContent = (i + 1) + ". " + r.name;
        const t = document.createElement("span");
        t.className = "t";
        t.textContent = r.time;
        row.append(n, t);
        list.append(row);
      });

      $("asub").hidden = !out.absent.length;
      $("asub").textContent = T.aabsent + " (" + out.absent.length + ")";
      const ab = $("aabsent");
      ab.replaceChildren();
      const excused = new Set((out.excused || []).map((name) => String(name).normalize("NFC").toLocaleLowerCase()));
      out.absent.forEach((name) => {
        const row = document.createElement("div");
        row.className = "arow";
        const label = document.createElement("span");
        label.textContent = name;
        row.append(label);
        if (excused.has(String(name).normalize("NFC").toLocaleLowerCase())) {
          const status = document.createElement("span");
          status.className = "t";
          status.textContent = T.excused;
          row.append(status);
        } else {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "aexcuse";
          button.textContent = T.markExcused;
          button.addEventListener("click", () => markExcused(name, button));
          row.append(button);
        }
        ab.append(row);
      });
      attendanceData = out;
      $("aexport").disabled = false;
      $("asummary-open").disabled = false;
    } catch (e) {
      $("aerr").textContent = T.net;
    } finally {
      if (!date) attendanceLoading = false;
    }
  }

  async function loadAttendanceSummary() {
    $("adaily").hidden = true;
    $("asummary").hidden = false;
    $("asummary-status").textContent = T.summaryLoading;
    $("asummary-error").textContent = "";
    $("asummary-list").replaceChildren();
    $("asummary-open").disabled = true;

    try {
      const dates = [...new Set(attendanceData?.dates || [])].sort((a, b) => String(b).localeCompare(String(a)));
      if (!dates.length) {
        $("asummary-status").textContent = T.summaryEmpty;
        return;
      }

      const records = new Map();
      if (attendanceData?.date) records.set(attendanceData.date, attendanceData);
      const missingDates = dates.filter((date) => !records.has(date));
      for (let i = 0; i < missingDates.length; i += 4) {
        const batch = missingDates.slice(i, i + 4);
        const results = await Promise.all(batch.map(async (date) => {
          const url = SCRIPT_URL + "?action=attendance&key=" + encodeURIComponent(password) +
                      "&date=" + encodeURIComponent(date);
          const response = await fetch(url);
          const out = await response.json();
          return { date, out };
        }));
        for (const { date, out } of results) {
          if (!out.ok) {
            if (out.error === "denied") {
              $("att").close();
              showLogin(T.wrong, true);
              return;
            }
            throw new Error(out.error === "locked" ? "locked" : "request");
          }
          records.set(date, out);
        }
      }

      const scouts = new Map();
      const getScout = (name) => {
        const key = String(name).normalize("NFC").toLocaleLowerCase();
        if (!scouts.has(key)) scouts.set(key, { name, attended: 0, eligible: 0, absences: [] });
        return scouts.get(key);
      };

      for (const date of dates) {
        const record = records.get(date);
        const excused = new Set((record.excused || []).map((name) =>
          String(name).normalize("NFC").toLocaleLowerCase()
        ));
        const present = new Set();
        for (const entry of record.present || []) {
          const key = String(entry.name).normalize("NFC").toLocaleLowerCase();
          present.add(key);
          const scout = getScout(entry.name);
          scout.attended++;
          scout.eligible++;
        }
        for (const name of record.absent || []) {
          const key = String(name).normalize("NFC").toLocaleLowerCase();
          if (present.has(key)) continue;
          const scout = getScout(name);
          scout.eligible++;
          scout.absences.push({ date, excused: excused.has(key) });
        }
      }

      const sortedScouts = [...scouts.values()].sort((a, b) =>
        (a.attended / a.eligible) - (b.attended / b.eligible) ||
        a.name.localeCompare(b.name, LANG)
      );
      if (!sortedScouts.length) {
        $("asummary-status").textContent = T.summaryEmpty;
        return;
      }

      $("asummary-status").textContent = dates.length + " " + T.summaryMeetings;
      const list = $("asummary-list");
      for (const scout of sortedScouts) {
        const row = document.createElement("div");
        row.className = "asummary-row";
        const top = document.createElement("div");
        top.className = "asummary-top";
        const name = document.createElement("strong");
        name.textContent = scout.name;
        const rate = document.createElement("span");
        rate.className = "asummary-rate";
        rate.textContent = T.summaryRate + ": " + Math.round((scout.attended / scout.eligible) * 100) + "%";
        top.append(name, rate);

        const detail = document.createElement("div");
        detail.className = "asummary-detail";
        detail.textContent = T.summaryAttended + " " + scout.attended + " " + T.summaryOf + " " +
                             scout.eligible + " " + T.summaryMeetings;
        const recent = document.createElement("div");
        recent.className = "asummary-detail";
        recent.textContent = T.summaryRecent + ": " +
          (scout.absences.slice(0, 3).map((absence) =>
            absence.date + (absence.excused ? " (" + T.excused + ")" : "")
          ).join(", ") || T.summaryNoAbsences);
        row.append(top, detail, recent);
        list.append(row);
      }
    } catch (e) {
      $("asummary-status").textContent = "";
      $("asummary-error").textContent = e.message === "locked" ? T.mlocked : T.net;
    } finally {
      $("asummary-open").disabled = false;
    }
  }

  function csvCell(value) {
    const text = String(value ?? "");
    const safe = /^[\t\r\n ]*[=+\-@]/.test(text) ? "'" + text : text;
    return '"' + safe.replace(/"/g, '""') + '"';
  }

  function exportAttendance() {
    if (!attendanceData) return;
    const excused = new Set((attendanceData.excused || []).map((name) =>
      String(name).normalize("NFC").toLocaleLowerCase()
    ));
    const rows = [
      [T.csvDate, T.csvName, T.csvStatus, T.csvTime],
      ...attendanceData.present.map((scout) => [
        attendanceData.date, scout.name, T.csvPresent, scout.time
      ]),
      ...attendanceData.absent.map((name) => {
        const isExcused = excused.has(String(name).normalize("NFC").toLocaleLowerCase());
        return [attendanceData.date, name, isExcused ? T.csvExcused : T.csvAbsent, ""];
      })
    ];
    const csv = "\uFEFF" + rows.map((row) => row.map(csvCell).join(",")).join("\r\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = "attendance-" + attendanceData.date + ".csv";
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  async function markExcused(name, button) {
    button.disabled = true;
    $("aerr").textContent = "";
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "excuse", key: password, name, date: $("adate").value })
      });
      const out = await res.json();
      if (!out.ok) {
        if (out.error === "denied") { $("att").close(); showLogin(T.wrong, true); }
        else $("aerr").textContent = out.error === "locked" ? T.mlocked : T.excuseError;
        return;
      }
      await loadAttendance($("adate").value);
    } catch (e) {
      $("aerr").textContent = T.excuseError;
    } finally {
      button.disabled = false;
    }
  }

  $("abtn").addEventListener("click", () => {
    $("asummary").hidden = true;
    $("adaily").hidden = false;
    $("att").showModal();
    loadAttendance();
  });
  $("aclose").addEventListener("click", () => $("att").close());
  $("aexport").addEventListener("click", exportAttendance);
  $("asummary-open").addEventListener("click", loadAttendanceSummary);
  $("asummary-back").addEventListener("click", () => {
    $("asummary").hidden = true;
    $("adaily").hidden = false;
  });
  $("arefresh").addEventListener("click", () => loadAttendance($("adate").value));
  $("adate").addEventListener("change", () => loadAttendance($("adate").value));

  // ---- Manual check-in: the leader can check in anyone at any time (no code needed) ----
  const NEW = "__new__";

  function fillNames(names) {
    const sel = $("mroster"), keep = sel.value;
    sel.innerHTML = "";
    sel.add(new Option(T.mpick, ""));
    names.forEach((n) => sel.add(new Option(n, n)));
    sel.add(new Option(T.mnew, NEW));
    sel.value = (names.includes(keep) || keep === NEW) ? keep : "";
    $("mname").hidden = sel.value !== NEW;
  }

  $("mroster").addEventListener("change", () => {
    $("mname").hidden = $("mroster").value !== NEW;
    if (!$("mname").hidden) $("mname").focus();
  });

  $("mgo").addEventListener("click", async () => {
    const msg = $("mmsg");
    msg.className = "hint";
    msg.textContent = "";
    const isNew = $("mroster").value === NEW;
    const name = (isNew ? $("mname").value : $("mroster").value).trim().replace(/\s+/g, " ");
    if (!name) { msg.textContent = T.mpickErr; return; }
    if (isNew && (name.split(" ").length < 3 || !/^[\p{L}\p{M}\s'’.\-]+$/u.test(name))) {
      msg.textContent = T.mbad;
      return;
    }
    $("mgo").disabled = true;
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "leader", key: password, name, isNew })
      });
      const out = await res.json();
      if (out.ok) {
        msg.className = "hint ok";
        msg.textContent = (out.duplicate ? T.mdup : T.mok) + " " + name;
        $("mroster").value = "";
        $("mname").value = "";
        $("mname").hidden = true;
        refresh(); // reloads the list so a newly added name appears
      } else if (out.error === "denied") {
        showLogin(T.wrong, true);
      } else {
        msg.textContent = out.error === "badname" ? T.mbad
                        : out.error === "toomany" ? T.mtoomany
                        : out.error === "locked"  ? T.mlocked
                        : T.net;
      }
    } catch (e) {
      msg.textContent = T.net;
    } finally {
      $("mgo").disabled = false;
    }
  });

  // Install as an app (works on GitHub Pages because everything uses relative paths).
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  // Keep the screen on while the code is showing.
  let wake = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !document.hidden) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  keepAwake();
  document.addEventListener("visibilitychange", keepAwake);

  // Phones pause timers when the screen sleeps; re-check as soon as the page is visible again.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && password) refresh(); });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (SCRIPT_URL.startsWith("PASTE_")) { $("error").textContent = "SCRIPT_URL not set"; return; }
    password = $("pw").value;
    $("go").disabled = true;
    $("error").textContent = "";
    await refresh();
    $("go").disabled = false;
  });

  try {
    const savedPassword = localStorage.getItem(PASSWORD_KEY);
    if (savedPassword) {
      $("remember").checked = true;
      password = savedPassword;
      refresh();
    }
  } catch (e) {
    $("error").textContent = T.rememberError;
  }
</script>
</body>
</html>
