<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1F4D2E">
  <title>Private attendance dashboard</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #e6ede1; --surface: #f7faf4; --ink: #14231a; --muted: #4c6054;
      --forest: #1f4d2e; --line: #b9c7b3; --error: #a82e24;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1d14; --surface: #172a1e; --ink: #e6efe2; --muted: #9db2a3; --forest: #3e8b58; --line: #2e4636; --error: #ff8f82; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100% - 2rem, 70rem); margin: 2rem auto; }
    h1 { margin: 0 0 1rem; }
    h2 { font-size: 1.2rem; margin: 0 0 .75rem; }
    section, form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; margin: 1rem 0; }
    input, button { font: inherit; border-radius: 8px; padding: .7rem .8rem; }
    input { max-width: 100%; color: var(--ink); background: var(--bg); border: 1px solid var(--line); }
    button { border: 0; background: var(--forest); color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .login { display: flex; flex-wrap: wrap; gap: .6rem; }
    .login input { flex: 1 1 14rem; }
    .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; }
    .toolbar h2 { margin: 0; }
    .muted, #status { color: var(--muted); }
    #status.error { color: var(--error); }
    .notice { font-size: .9rem; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: start; }
    th, td { padding: .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { white-space: nowrap; }
    td.device { min-width: 14rem; overflow-wrap: anywhere; font-size: .85rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Private attendance dashboard</h1>
  <p class="notice muted" id="notice">Sign in.</p>
  <form id="login" class="login">
    <input id="password" type="password" autocomplete="current-password" placeholder="Leader password" required>
    <button id="sign-in" type="submit">Sign in</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="dashboard" hidden>
    <section>
      <div class="toolbar">
        <h2 id="attendance-title">Attendance</h2>
        <label><span id="date-label">Meeting date</span> <input id="date" type="date"></label>
      </div>
      <p id="attendance-count" class="muted"></p>
      <div class="scroll"><table>
        <thead><tr><th id="scout-heading">Scout</th><th id="attendance-heading">Attendance</th><th id="time-heading">Check-in time</th></tr></thead>
        <tbody id="attendance-rows"></tbody>
      </table></div>
    </section>
    <section>
      <div class="toolbar">
        <h2 id="audit-title">Change history (latest 500)</h2>
        <div>
          <button id="reload" type="button">Refresh</button>
          <button id="logout" type="button">Sign out</button>
        </div>
      </div>
      <div class="scroll"><table>
        <thead><tr><th id="when-heading">Changed at</th><th id="change-heading">Change</th><th id="actor-heading">Recorded as</th><th id="date-heading">Meeting date</th><th id="name-heading">Name</th><th id="device-heading">Device / browser</th></tr></thead>
        <tbody id="audit-rows"></tbody>
      </table></div>
    </section>
  </div>
</main>
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHuT96lN2SpUvKUu_ibgIgMxehFNJ79FFlpnvn-XNh_jW1E8pmZJzZZzlDHRVe90MqZA/exec";
  const LANG = "en";
  const TEXT = {
    en: {
      title: "Private attendance dashboard",
      notice: "Sign in with your private admin password. This page shows app-recorded attendance and changes. Browser details may not identify an exact phone model, and changes made directly in the spreadsheet are not included.",
      password: "Private admin password", signIn: "Sign in", attendance: "Attendance",
      meetingDate: "Meeting date", scout: "Scout", status: "Attendance",
      time: "Check-in time", present: "Present", absent: "Absent",
      excused: "Excused", count: "Present: {present} / {total}",
      history: "Change history (latest 500)", refresh: "Refresh", signOut: "Sign out",
      when: "Changed at", change: "Change", actor: "Recorded as",
      date: "Meeting date", name: "Name", device: "Device / browser",
      checkin: "Check-in", excuse: "Excuse added", roster_add: "Scout added to roster",
      leader: "Leader account", scoutActor: "Scout check-in",
      noAttendance: "No attendance records for this date.",
      noEvents: "No changes have been recorded yet.",
      denied: "Incorrect leader password.", locked: "Too many attempts. Try again later.",
      admin_unconfigured: "Set ADMIN_PASSWORD in Apps Script project settings first.",
      failed: "Could not load the dashboard. Check the connection and try again."
    },
    ar: {
      title: "لوحة الحضور الخاصة",
      notice: "سجّل الدخول بكلمة مرور الإدارة الخاصة بك. تعرض هذه الصفحة الحضور والتغييرات المسجلة عبر التطبيق. قد لا تكشف بيانات المتصفح طراز الهاتف بدقة، ولا تشمل التغييرات المباشرة في جدول البيانات.",
      password: "كلمة مرور الإدارة", signIn: "دخول", attendance: "الحضور",
      meetingDate: "تاريخ الاجتماع", scout: "الكشاف", status: "الحالة",
      time: "وقت التسجيل", present: "حاضر", absent: "غائب",
      excused: "بعذر", count: "الحاضرون: {present} / {total}",
      history: "سجل التغييرات (آخر 500)", refresh: "تحديث", signOut: "خروج",
      when: "وقت التغيير", change: "التغيير", actor: "المنفّذ",
      date: "تاريخ الاجتماع", name: "الاسم", device: "الجهاز / المتصفح",
      checkin: "تسجيل حضور", excuse: "إضافة عذر", roster_add: "إضافة كشاف للقائمة",
      leader: "حساب القائد", scoutActor: "تسجيل الكشاف",
      noAttendance: "لا توجد سجلات حضور لهذا التاريخ.",
      noEvents: "لم يتم تسجيل تغييرات بعد.",
      denied: "كلمة مرور القائد غير صحيحة.", locked: "محاولات كثيرة. حاول لاحقًا.",
      admin_unconfigured: "يجب إعداد ADMIN_PASSWORD في إعدادات مشروع Apps Script أولًا.",
      failed: "تعذّر تحميل اللوحة. تحقق من الاتصال وحاول مرة أخرى."
    }
  }[LANG];
  const $ = id => document.getElementById(id);
  let leaderPassword = "";

  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  $("title").textContent = TEXT.title;
  $("notice").textContent = TEXT.notice;
  $("password").placeholder = TEXT.password;
  $("sign-in").textContent = TEXT.signIn;
  $("attendance-title").textContent = TEXT.attendance;
  $("date-label").textContent = TEXT.meetingDate;
  $("scout-heading").textContent = TEXT.scout;
  $("attendance-heading").textContent = TEXT.status;
  $("time-heading").textContent = TEXT.time;
  $("audit-title").textContent = TEXT.history;
  $("reload").textContent = TEXT.refresh;
  $("logout").textContent = TEXT.signOut;
  $("when-heading").textContent = TEXT.when;
  $("change-heading").textContent = TEXT.change;
  $("actor-heading").textContent = TEXT.actor;
  $("date-heading").textContent = TEXT.date;
  $("name-heading").textContent = TEXT.name;
  $("device-heading").textContent = TEXT.device;

  function cell(row, value, className) {
    const td = document.createElement("td");
    td.textContent = value;
    if (className) td.className = className;
    row.append(td);
  }

  function showStatus(message, isError = false) {
    $("status").textContent = message;
    $("status").className = isError ? "error" : "";
  }

  async function loadDashboard() {
    $("reload").disabled = true;
    showStatus("");
    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "admin", key: leaderPassword, date: $("date").value
        })
      });
      const result = await response.json();
      if (!result.ok) {
        if (result.error === "denied" || result.error === "locked" || result.error === "admin_unconfigured") {
          showStatus(TEXT[result.error], true);
          if (result.error === "denied") {
            leaderPassword = "";
            $("dashboard").hidden = true;
            $("login").hidden = false;
          }
        } else showStatus(TEXT.failed, true);
        return;
      }

      const attendance = result.attendance;
      $("date").value = attendance.date;
      $("attendance-count").textContent = TEXT.count
        .replace("{present}", attendance.present.length)
        .replace("{total}", attendance.total);
      const attendees = new Map(attendance.present.map(item => [item.name, item.time]));
      const excused = new Set((attendance.excused || []).map(name => name.normalize("NFC").toLocaleLowerCase()));
      const attendanceRows = $("attendance-rows");
      attendanceRows.replaceChildren();
      if (!attendance.absent.length && !attendance.present.length) {
        const row = attendanceRows.insertRow();
        const td = row.insertCell();
        td.colSpan = 3;
        td.textContent = TEXT.noAttendance;
      } else {
        attendance.present.forEach(item => {
          const row = attendanceRows.insertRow();
          cell(row, item.name);
          cell(row, TEXT.present);
          cell(row, item.time);
        });
        attendance.absent.forEach(name => {
          const row = attendanceRows.insertRow();
          cell(row, name);
          const key = name.normalize("NFC").toLocaleLowerCase();
          cell(row, excused.has(key) ? TEXT.excused : TEXT.absent);
          cell(row, attendees.get(name) || "—");
        });
      }

      const auditRows = $("audit-rows");
      auditRows.replaceChildren();
      if (!result.events.length) {
        const row = auditRows.insertRow();
        const td = row.insertCell();
        td.colSpan = 6;
        td.textContent = TEXT.noEvents;
      } else {
        result.events.forEach(event => {
          const row = auditRows.insertRow();
          cell(row, event.changedAt);
          cell(row, TEXT[event.action] || event.action);
          cell(row, event.actor === "leader" ? TEXT.leader : TEXT.scoutActor);
          cell(row, event.date);
          cell(row, event.name);
          cell(row, event.browser || "—", "device");
        });
      }
      $("login").hidden = true;
      $("dashboard").hidden = false;
    } catch (error) {
      showStatus(TEXT.failed, true);
    } finally {
      $("reload").disabled = false;
    }
  }

  $("login").addEventListener("submit", async event => {
    event.preventDefault();
    leaderPassword = $("password").value;
    await loadDashboard();
  });
  $("reload").addEventListener("click", loadDashboard);
  $("date").addEventListener("change", loadDashboard);
  $("logout").addEventListener("click", () => {
    leaderPassword = "";
    $("password").value = "";
    $("dashboard").hidden = true;
    $("login").hidden = false;
    showStatus("");
  });
</script>
</body>
</html>
